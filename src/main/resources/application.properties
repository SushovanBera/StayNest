# ===================================================================
# StayNest Application Configuration
# ===================================================================
spring.application.name=staynest
server.port=8080

# -------------------------------------------------------------------
# Zero-Install Database Configuration (No external MySQL server needed)
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:staynest_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Static resources mapping (Frontend served from classpath:/static/)
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# -------------------------------------------------------------------
# Firebase Configuration
# -------------------------------------------------------------------
firebase.credential.path=classpath:firebase-service-account.json
firebase.project-id=staynest-booking

# -------------------------------------------------------------------
# Security & JWT Configuration
# -------------------------------------------------------------------
staynest.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
staynest.jwt.expiration-ms=86400000

# File Upload limits for property photos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.com.staynest=INFO
logging.level.org.springframework.security=WARN
