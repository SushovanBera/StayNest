<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Stays — StayNest</title>
  
  <!-- Bootstrap 5 CSS & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- ===================================================================
       Navbar
       =================================================================== -->
  <nav class="staynest-navbar">
    <div class="container-fluid px-lg-5 d-flex justify-content-between align-items-center">
      <a class="brand-logo" href="index.html">
        <svg viewBox="0 0 32 32">
          <path d="M16 1c2.008 0 3.463.963 4.751 3.269l.533 1.025c1.954 3.83 6.114 12.54 7.1 14.836l.145.353c.667 1.591.91 2.472.96 3.396l.011.315c0 4.39-3.411 7.806-7.8 7.806-3.087 0-5.356-1.579-6.7-4.14-1.344 2.561-3.613 4.14-6.7 4.14-4.389 0-7.8-3.416-7.8-7.806 0-1.168.328-2.392 1.053-4.017l.063-.147c.986-2.296 5.146-11.006 7.1-14.836l.533-1.025C10.537 1.963 11.992 1 14 1h2zm0 2h-2c-1.294 0-2.316.634-3.376 2.527l-.527 1.014c-1.936 3.793-6.082 12.474-7.054 14.739l-.053.125C2.378 22.95 2.1 23.955 2.1 24.894c0 3.277 2.523 5.806 5.8 5.806 2.748 0 4.887-1.748 5.922-4.492l.478-1.341.478 1.341c1.035 2.744 3.174 4.492 5.922 4.492 3.277 0 5.8-2.529 5.8-5.806 0-.939-.278-1.944-.89-3.489l-.053-.125c-.972-2.265-5.118-10.946-7.054-14.739l-.527-1.014C17.316 3.634 16.294 3 15 3h1z"/>
        </svg>
        <span>StayNest</span>
      </a>

      <!-- Compact Search Bar in Navbar -->
      <div class="d-flex align-items-center gap-2">
        <input type="text" id="filterDestination" class="form-control rounded-pill px-3 py-2 border shadow-sm" 
               placeholder="Destination..." style="max-width: 220px;" onkeydown="if(event.key==='Enter') applyFilters()">
        <button class="btn btn-primary rounded-circle" style="width: 40px; height: 40px; padding: 0;" onclick="applyFilters()">
          <i class="bi bi-search"></i>
        </button>
      </div>

      <div class="nav-user-menu" id="userNavContainer"></div>
    </div>
  </nav>

  <!-- ===================================================================
       Sub-Header Filter Control Bar
       =================================================================== -->
  <section class="border-bottom py-3 bg-white sticky-top shadow-sm" style="top: 70px; z-index: 1000;">
    <div class="container-fluid px-lg-5">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
        <!-- Quick Filters -->
        <div class="d-flex flex-wrap align-items-center gap-2">
          <button class="btn btn-outline-dark btn-sm rounded-pill px-3 py-2 d-flex align-items-center gap-2" 
                  data-bs-toggle="modal" data-bs-target="#filterModal">
            <i class="bi bi-sliders2"></i>
            <span>All Filters</span>
          </button>

          <select class="form-select form-select-sm rounded-pill" id="filterCategorySelect" style="width: auto;" onchange="applyFilters()">
            <option value="">All Categories</option>
          </select>

          <select class="form-select form-select-sm rounded-pill" id="filterPropertyType" style="width: auto;" onchange="applyFilters()">
            <option value="">Any Property Type</option>
            <option value="Villa">Villa</option>
            <option value="Cabin">Cabin</option>
            <option value="Apartment">Apartment</option>
            <option value="House">House</option>
            <option value="Chalet">Chalet</option>
            <option value="Mansion">Mansion</option>
          </select>

          <div class="d-none d-md-flex align-items-center gap-1">
            <input type="date" id="filterCheckIn" class="form-control form-control-sm rounded-pill" title="Check-in" onchange="applyFilters()">
            <span class="text-muted">&rarr;</span>
            <input type="date" id="filterCheckOut" class="form-control form-control-sm rounded-pill" title="Check-out" onchange="applyFilters()">
          </div>

          <button class="btn btn-link text-muted btn-sm text-decoration-none" id="clearFiltersBtn">
            Reset
          </button>
        </div>

        <!-- Sorting & Results Count -->
        <div class="d-flex align-items-center gap-3">
          <span class="text-muted small fw-bold" id="resultsCountLabel">Searching stays...</span>
          <div class="d-flex align-items-center gap-2">
            <label for="sortBySelect" class="text-muted small d-none d-sm-inline">Sort by:</label>
            <select class="form-select form-select-sm rounded-pill" id="sortBySelect" style="width: auto;">
              <option value="newest" selected>Newest Additions</option>
              <option value="price_asc">Price: Low to High</option>
              <option value="price_desc">Price: High to Low</option>
              <option value="rating">Top Rated</option>
              <option value="popularity">Most Popular</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===================================================================
       Main Listings Grid
       =================================================================== -->
  <main class="py-4">
    <div class="container-fluid px-lg-5">
      <div class="row" id="exploreListingsContainer">
        <!-- Rendered dynamically by explore.js -->
      </div>
    </div>
  </main>

  <!-- ===================================================================
       Comprehensive Filter Modal
       =================================================================== -->
  <div class="modal fade" id="filterModal" tabindex="-1" aria-labelledby="filterModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content rounded-4 border-0 shadow-lg">
        <div class="modal-header border-bottom px-4">
          <h5 class="modal-title fw-bold" id="filterModalLabel">Filters</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body p-4">
          <!-- Price Range Section -->
          <div class="mb-4">
            <h6 class="fw-bold mb-2">Price Range (per night)</h6>
            <div class="row g-3">
              <div class="col-6">
                <label class="form-label small text-muted">Minimum ($)</label>
                <input type="number" class="form-control rounded-3" id="filterMinPrice" placeholder="50" min="0">
              </div>
              <div class="col-6">
                <label class="form-label small text-muted">Maximum ($)</label>
                <input type="number" class="form-control rounded-3" id="filterMaxPrice" placeholder="1000" min="0">
              </div>
            </div>
          </div>

          <hr>

          <!-- Guest Capacity & Rating -->
          <div class="row g-3 mb-4">
            <div class="col-6">
              <h6 class="fw-bold mb-2">Guests</h6>
              <select class="form-select rounded-3" id="filterGuests">
                <option value="">Any number of guests</option>
                <option value="1">1+ guests</option>
                <option value="2">2+ guests</option>
                <option value="4">4+ guests</option>
                <option value="6">6+ guests</option>
                <option value="8">8+ guests</option>
              </select>
            </div>
            <div class="col-6">
              <h6 class="fw-bold mb-2">Minimum Rating</h6>
              <select class="form-select rounded-3" id="filterRating">
                <option value="">Any rating</option>
                <option value="4.5">4.5+ Stars (Exceptional)</option>
                <option value="4.8">4.8+ Stars (Superb)</option>
                <option value="4.9">4.9+ Stars (Rare find)</option>
              </select>
            </div>
          </div>

          <hr>

          <!-- Amenities Multi-Select -->
          <div class="mb-3">
            <h6 class="fw-bold mb-3">Amenities</h6>
            <div class="row" id="amenitiesFilterCheckboxes">
              <!-- Rendered dynamically -->
            </div>
          </div>
        </div>

        <div class="modal-footer border-top px-4 d-flex justify-content-between">
          <button type="button" class="btn btn-link text-dark text-decoration-none fw-bold" onclick="clearAllFilters()">
            Clear all
          </button>
          <button type="button" class="btn btn-primary rounded-pill px-4" id="applyFiltersBtn">
            Apply Filters
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Global Auth Modal Included -->
  <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4 border-0 shadow-lg p-3">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold">Welcome to StayNest</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <ul class="nav nav-pills nav-fill mb-4 p-1 bg-light rounded-pill">
            <li class="nav-item">
              <button class="nav-link active rounded-pill fw-bold" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-panel">Log In</button>
            </li>
            <li class="nav-item">
              <button class="nav-link rounded-pill fw-bold" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-panel">Sign Up</button>
            </li>
          </ul>
          <div class="tab-content">
            <div class="tab-pane fade show active" id="login-panel">
              <form id="loginForm">
                <div class="mb-3">
                  <label class="form-label small fw-bold">Email Address</label>
                  <input type="email" class="form-control rounded-3" id="loginEmail" required placeholder="name@example.com">
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-bold">Password</label>
                  <input type="password" class="form-control rounded-3" id="loginPassword" required placeholder="Enter password">
                </div>
                <button type="submit" id="loginSubmitBtn" class="btn btn-primary w-100 py-2 rounded-pill mt-2">Continue</button>
              </form>
              <div class="text-center my-3 text-muted small">&mdash; or test with demo account &mdash;</div>
              <div class="d-flex justify-content-center gap-2">
                <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill" onclick="fillDemoAccount('guest')">Demo Guest</button>
                <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill" onclick="fillDemoAccount('host')">Demo Host</button>
                <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill" onclick="fillDemoAccount('admin')">Demo Admin</button>
              </div>
            </div>
            <div class="tab-pane fade" id="register-panel">
              <form id="registerForm">
                <div class="row g-2 mb-3">
                  <div class="col"><input type="text" class="form-control rounded-3" id="regFirstName" required placeholder="First name"></div>
                  <div class="col"><input type="text" class="form-control rounded-3" id="regLastName" required placeholder="Last name"></div>
                </div>
                <div class="mb-3"><input type="email" class="form-control rounded-3" id="regEmail" required placeholder="Email"></div>
                <div class="mb-3"><input type="password" class="form-control rounded-3" id="regPassword" required minlength="6" placeholder="Password"></div>
                <div class="mb-3">
                  <select class="form-select rounded-3" id="regRole">
                    <option value="ROLE_GUEST">Guest</option>
                    <option value="ROLE_HOST">Host</option>
                  </select>
                </div>
                <button type="submit" id="registerSubmitBtn" class="btn btn-primary w-100 py-2 rounded-pill">Sign Up</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle & Custom Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/explore.js"></script>
</body>
</html>
